<!--
  Title-slide partial for ssus-slides, adapted from Quarto's bundled
  share/formats/revealjs/pandoc/title-slide.html (Quarto 1.10.19).

  The hero: the series eyebrow, the title, and the subtitle hold the middle
  of the slide; a hairline foot carries the byline on the left and the
  horizontal lockup on the right. The blueprint ground and grid come from
  ssus.lua through title-slide-attributes (reveal's background layer), and so
  does ssus-lockup-src, a data URI of assets/ssus-horizontal-dark.svg read at
  render time.

  Options consumed: ssus-series (eyebrow text), ssus-lockup (default true).
-->
<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
<div class="ssus-hero">
  <div class="ssus-hero-head">
$if(ssus-series)$
    <p class="ssus-eyebrow">$ssus-series$</p>
$endif$
    <h1 class="title">$title$</h1>
$if(subtitle)$
    <p class="subtitle">$subtitle$</p>
$endif$
  </div>
  <div class="ssus-hero-foot">
    <div class="ssus-byline">
$if(author)$
      <div class="ssus-authors">
$for(author)$
        <p class="author">$author$</p>
$endfor$
      </div>
$endif$
$for(institute)$
      <p class="institute">$institute$</p>
$endfor$
$if(date)$
      <p class="date">$date$</p>
$endif$
    </div>
$if(ssus-lockup)$
$if(ssus-lockup-src)$
    <img class="ssus-lockup" src="$ssus-lockup-src$" alt="Spatial Science and Urban Systems, UC Irvine">
$endif$
$endif$
  </div>
</div>
</section>
