  Adds the SSUS grammar from the brand sheets (ssus-lab-brand/sheets/
  ssus-identity-mocks.html): an eyebrow series line above the title, and the
  stacked lockup as an inline data-URI (house precedent: the masthead
  extension's title-block.html; plain src broke in real render contexts).

  Options consumed: ssus-series (eyebrow text), ssus-dark (bool), ssus-lockup
  (bool, default true). Regenerate the data-URIs below with:
  base64 -i assets/ssus-stacked-{dark,night}.svg | tr -d '\n'
  (ssus-lab-brand/build/lockups.py regenerates the SVGs themselves.)
-->

$endif$
$for(author)$

$endfor$
$for(institute)$
  <p class="institute">$institute$</p>
