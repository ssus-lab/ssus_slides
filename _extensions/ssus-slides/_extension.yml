title: SSUS slides
author: Eli Knaap
version: 0.2.8
quarto-required: ">=1.4.11"

# The SSUS revealjs format: one SCSS theme layered on `default`, after
# grantmcdermott/quarto-revealjs-clean (MIT), with the identity entirely
# SSUS. Tokens are hardcoded in ssus-slides.scss, each with its source in
# ssus-lab-brand, because revealjs does not consume _brand.yml the way html
# does.
#
# ssus.lua paints the blueprint grounds (title slide, `#` section slides,
# `.ssus-blueprint` slides) through reveal's background layer, numbers the
# parts, writes the running heads, switches dark decks on
# `ssus-dark: true`, and adds a viewer's light/dark switch on
# `ssus-theme-toggle: true`.
#
# Install as a dependency, never by copying this folder in:
# `quarto add ssus-lab/ssus_slides@<tag>` lands it at
# _extensions/ssus-lab/ssus-slides/. A hand copy, partially re-synced, once
# left a stale format elsewhere in the house, and Quarto fell back to plain
# html without a word.

contributes:
  formats:
    revealjs:
      theme: [default, ssus-slides.scss]
      filters: [ssus.lua]
      template-partials: [title-slide.html]
      # the mark alone: the horizontal lockup stops reading below 240 px
      logo: ssus-mark-light.svg
      # the deck box is the 1280×720 canvas exactly; slides pad themselves
      width: 1280
      height: 720
      margin: 0.0
      center: false
      menu:
        side: left
      slide-number: c/t
      progress: false
      code-line-numbers: false
      date-format: long
      fig-width: 11.2
      fig-height: 3.8
      html-math-method:
        method: mathjax
        url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
      include-in-header:
        - text: |
            <script>
            /* Reveal sizes its slide stack early; when vendored faces swap in
               afterwards, metrics move and slides can land half-scrolled.
               Re-run the layout once the fonts settle. */
            document.fonts.ready.then(function () {
              if (window.Reveal && window.Reveal.sync) { window.Reveal.sync(); }
            });
            </script>
      # The vendored OFL faces, read in place: Quarto links this stylesheet
      # from the installed extension, so its urls resolve in fonts/ and
      # nothing is copied next to the deck.
      css: [fonts/ssus-fonts.css]
      # MathJax's configuration, inline: it must be set before MathJax
      # loads, and a file would have to be copied next to the deck.
      include-before-body:
        - text: |
            <script>
            window.MathJax = {
              tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true,
                processRefs: true,
                processEnvironments: true
              },
              chtml: {
                font: 'mathjax-asana'
              },
              startup: {
                ready: () => {
                  console.log('MathJax is loaded and ready with font: mathjax-asana (Asana Math)');
                  MathJax.startup.defaultReady();
                }
              }
            };
            </script>
